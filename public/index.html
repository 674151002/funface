<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมถ่ายรูปทำหน้าตลก (Railway Edition)</title>
  <style>
    * { box-sizing: border-box; font-family: 'Sukhumvit Set', 'Kanit', sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    
    .nav-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .nav-btn { background: #e0e0e0; color: #333; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .nav-btn.active { background: #4F46E5; color: white; }

    input[type="text"] { font-size: 16px; padding: 10px; width: 80%; max-width: 300px; margin-bottom: 15px; border: 2px solid #ccc; border-radius: 8px; text-align: center; }
    .btn { background-color: #10B981; color: white; border: none; padding: 12px 24px; font-size: 18px; border-radius: 25px; cursor: pointer; font-weight: bold; }
    
    .screen { display: none; }
    .screen.active { display: block; }

    .game-box { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 15px; }
    .view-card { flex: 1; min-width: 280px; background: #fafafa; padding: 10px; border-radius: 10px; border: 2px solid #ddd; }
    img.target-img, video { width: 100%; height: 260px; object-fit: cover; border-radius: 8px; background: #000; }
    video { transform: scaleX(-1); }
    
    .timer-badge { font-size: 48px; font-weight: bold; color: #EF4444; margin: 5px 0; }
    .round-badge { font-size: 18px; color: #4F46E5; font-weight: bold; }

    /* Teacher Dashboard Styles */
    .teacher-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: left; }
    .teacher-card h3 { margin: 0 0 10px 0; color: #1e293b; }
    .grid-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .grid-photos img { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-bar">
    <button class="nav-btn active" id="btn-mode-student" onclick="switchMode('student')">🎮 โหมดนักเรียน</button>
    <button class="nav-btn" id="btn-mode-teacher" onclick="switchMode('teacher')">👨‍🏫 ระบบครู (ดูผลรวม)</button>
  </div>

  <!-- ส่วนนักเรียน -->
  <div id="student-view">
    <div id="start-screen" class="screen active">
      <h1>🤪 เกมถ่ายรูปทำหน้าตลก 10 ท่า</h1>
      <input type="text" id="student-name" placeholder="กรอกชื่อ-นามสกุล หรือ เลขที่"><br>
      <button class="btn" onclick="startGame()">เริ่มเล่นเกม</button>
    </div>

    <div id="game-screen" class="screen">
      <div class="round-badge" id="round-text">ภาพที่ 1 / 10</div>
      <div class="timer-badge" id="timer-text">10</div>

      <div class="game-box">
        <div class="view-card">
          <h3>🎯 ภาพต้นแบบ</h3>
          <img id="target-image" src="" alt="ภาพต้นแบบ">
        </div>
        <div class="view-card">
          <h3>📸 กล้องของคุณ</h3>
          <video id="webcam" autoplay playsinline muted></video>
        </div>
      </div>
    </div>

    <div id="result-screen" class="screen">
      <h1>🎉 คุณถ่ายภาพครบทั้ง 10 ท่าแล้ว!</h1>
      <p id="status-text">⏳ กำลังส่งผลงานไปยังระบบครู...</p>
      <button class="btn" onclick="location.reload()">เล่นใหม่อีกครั้ง</button>
    </div>
  </div>

  <!-- ส่วนครู (Dashboard) -->
  <div id="teacher-view" style="display:none;">
    <h1>📊 แผงรวมภาพถ่ายของนักเรียน</h1>
    <button class="btn" onclick="loadTeacherDashboard()" style="margin-bottom: 15px; font-size: 14px; padding: 8px 16px;">🔄 รีเฟรชข้อมูล</button>
    <div id="teacher-results-list">ไม่มีข้อมูลผลงานนักเรียนในขณะนี้</div>
  </div>
</div>

<canvas id="capture-canvas" style="display:none;"></canvas>

<script>
  let targetImages = [];
  let currentRound = 0;
  let timeLeft = 10;
  let timerInterval = null;
  const capturedPhotos = [];
  let studentName = "";

  const video = document.getElementById('webcam');
  const canvas = document.getElementById('capture-canvas');

  window.onload = async () => {
    const res = await fetch('/api/targets');
    targetImages = await res.json();
  };

  async function startGame() {
    studentName = document.getElementById('student-name').value.trim();
    if (!studentName) return alert('กรุณากรอกชื่อก่อนเล่นเกม');

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = stream;
      switchScreen('game-screen');
      nextRound();
    } catch (err) {
      alert('ไม่สามารถเข้าถึงกล้องได้ โปรดอนุญาตสิทธิ์กล้องในเบราว์เซอร์');
    }
  }

  function nextRound() {
    if (currentRound >= targetImages.length) {
      endGame();
      return;
    }

    document.getElementById('round-text').innerText = `ภาพที่ ${currentRound + 1} / ${targetImages.length}`;
    document.getElementById('target-image').src = targetImages[currentRound];
    
    timeLeft = 10;
    document.getElementById('timer-text').innerText = timeLeft;

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timer-text').innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        takePhoto();
      }
    }, 1000);
  }

  function takePhoto() {
    const context = canvas.getContext('2d');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    context.translate(canvas.width, 0);
    context.scale(-1, 1);
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    capturedPhotos.push(canvas.toDataURL('image/png'));
    currentRound++;
    nextRound();
  }

  async function endGame() {
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    switchScreen('result-screen');

    const res = await fetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ studentName, photos: capturedPhotos })
    });

    const data = await res.json();
    document.getElementById('status-text').innerText = data.success ? '✅ ส่งภาพถ่ายสำเร็จแล้ว!' : '❌ เกิดข้อผิดพลาดในการส่งข้อมูล';
  }

  function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function switchMode(mode) {
    document.getElementById('btn-mode-student').classList.toggle('active', mode === 'student');
    document.getElementById('btn-mode-teacher').classList.toggle('active', mode === 'teacher');
    document.getElementById('student-view').style.display = mode === 'student' ? 'block' : 'none';
    document.getElementById('teacher-view').style.display = mode === 'teacher' ? 'block' : 'none';
    
    if (mode === 'teacher') loadTeacherDashboard();
  }

  async function loadTeacherDashboard() {
    const container = document.getElementById('teacher-results-list');
    container.innerHTML = 'กำลังโหลดข้อมูล...';

    const res = await fetch('/api/results');
    const results = await res.json();

    if (results.length === 0) {
      container.innerHTML = '<p>ยังไม่มีนักเรียนส่งผลงาน</p>';
      return;
    }

    container.innerHTML = results.map(item => `
      <div class="teacher-card">
        <h3>👤 ${item.studentName} <span style="font-size:12px; color:#666; font-weight:normal;">(${item.timestamp})</span></h3>
        <div class="grid-photos">
          ${item.photos.map((img, i) => `<img src="${img}" title="ท่าที่ ${i+1}">`).join('')}
        </div>
      </div>
    `).join('');
  }
</script>

</body>
</html>
