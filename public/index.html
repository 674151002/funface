<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funny Face Challenge 🤪</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
    .mirror { transform: scaleX(-1); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <header class="max-w-5xl mx-auto pt-6 px-4 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <span class="text-3xl">🤪</span>
      <h1 class="text-2xl font-bold bg-gradient-to-r from-yellow-400 to-pink-500 bg-clip-text text-transparent">
        FunnyFace Game
      </h1>
    </div>
    <div class="bg-slate-800 p-1 rounded-xl flex border border-slate-700">
      <button id="btn-tab-student" onclick="switchTab('student')" class="px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition-all shadow-md">
        🎮 นักเรียน
      </button>
      <button id="btn-tab-teacher" onclick="switchTab('teacher')" class="px-4 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all flex items-center gap-2">
        👨‍🏫 หน้าจอครู <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto mt-6 px-4">

    <!-- Section นักเรียน -->
    <div id="student-view">
      <div id="screen-start" class="bg-slate-800 border border-slate-700 rounded-3xl p-8 max-w-lg mx-auto text-center shadow-2xl">
        <div class="text-6xl mb-4">📸</div>
        <h2 class="text-3xl font-bold text-white mb-2">เกมถ่ายรูปทำหน้าตลก</h2>
        <p class="text-slate-400 mb-6">ทำหน้าตามรูปต้นแบบแล้วกดปุ่มถ่ายรูปให้ครบ 10 ท่า</p>
        
        <input type="text" id="student-name" placeholder="ระบุชื่อ-นามสกุล หรือ เลขที่..." 
               class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-5 py-4 text-center text-lg text-white focus:outline-none focus:border-indigo-500 mb-6">
        
        <button onclick="startGame()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-2xl text-xl transition-all shadow-lg shadow-emerald-500/20 active:scale-95">
          🚀 เริ่มเล่นเกม
        </button>
      </div>

      <div id="screen-game" class="hidden">
        <div class="flex justify-between items-center mb-6 bg-slate-800 border border-slate-700 p-4 rounded-2xl">
          <span class="bg-indigo-500/20 text-indigo-400 px-4 py-1.5 rounded-full font-bold border border-indigo-500/30 text-lg" id="round-text">
            ท่าที่ 1 / 10
          </span>
          <span class="text-slate-300 font-medium text-sm">พร้อมแล้วกดปุ่ม "ถ่ายรูปภาพนี้" ด้านล่างได้เลย!</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div class="bg-slate-800 border border-slate-700 rounded-3xl p-4 text-center shadow-xl">
            <h3 class="text-slate-400 font-semibold mb-3">🎯 ท่าต้นแบบ</h3>
            <div class="relative aspect-square rounded-2xl overflow-hidden bg-slate-900 border border-slate-700 flex items-center justify-center p-2">
              <img id="target-img" src="" class="max-w-full max-h-full object-contain">
            </div>
          </div>

          <div class="bg-slate-800 border border-slate-700 rounded-3xl p-4 text-center shadow-xl">
            <h3 class="text-slate-400 font-semibold mb-3">📸 กล้องของคุณ</h3>
            <div class="relative aspect-square rounded-2xl overflow-hidden bg-slate-900 border border-slate-700">
              <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover mirror"></video>
            </div>
          </div>
        </div>

        <!-- ปุ่มถ่ายรูปใหญ่ชัดเจน -->
        <button onclick="takePhoto()" class="w-full bg-gradient-to-r from-amber-500 to-rose-500 hover:from-amber-600 hover:to-rose-600 text-white font-bold py-5 rounded-2xl text-2xl shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3">
          <span>📸</span> กดถ่ายรูปภาพนี้
        </button>
      </div>

      <div id="screen-finish" class="hidden bg-slate-800 border border-slate-700 rounded-3xl p-8 max-w-lg mx-auto text-center">
        <div class="text-6xl mb-4">🎉</div>
        <h2 class="text-3xl font-bold text-white mb-2">ถ่ายครบ 10 ท่าเรียบร้อย!</h2>
        <p class="text-slate-400 mb-6">กดปุ่มด้านล่างเพื่อส่งผลงานขึ้นหน้าจอคุณครู</p>
        
        <button id="btn-submit" onclick="submitPhotos()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-2xl text-xl shadow-lg mb-4 active:scale-95 transition-all">
          📤 กดส่งผลงานให้คุณครู
        </button>
        <p id="upload-status" class="font-medium hidden"></p>
      </div>
    </div>

    <!-- Section ครู -->
    <div id="teacher-view" class="hidden">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-white flex items-center gap-2">
          📊 ผลงานนักเรียน <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/30">Real-time</span>
        </h2>
        <div id="total-students" class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl text-slate-300 font-semibold">
          ส่งแล้ว 0 คน
        </div>
      </div>

      <div id="teacher-gallery" class="space-y-6"></div>
    </div>

  </main>

  <canvas id="canvas" class="hidden"></canvas>

<script>
  const socket = io();
  let targetImages = [];
  let currentRound = 0;
  const capturedPhotos = [];
  let studentName = "";

  const video = document.getElementById('webcam');
  const canvas = document.getElementById('canvas');

  fetch('/api/targets').then(r => r.json()).then(data => targetImages = data);

  socket.on('new_submission', (data) => {
    addSubmissionToTeacherView(data, true);
  });

  async function startGame() {
    studentName = document.getElementById('student-name').value.trim();
    if (!studentName) return alert('กรุณากรอกชื่อก่อนเริ่มเล่นเกมครับ');

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = stream;
      
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');
      updateRoundUI();
    } catch (err) {
      alert('เปิดกล้องไม่ได้! โปรดอนุญาตสิทธิ์การใช้งานกล้องในเบราว์เซอร์');
    }
  }

  function updateRoundUI() {
    if (currentRound >= targetImages.length) {
      finishGame();
      return;
    }
    document.getElementById('round-text').innerText = `ท่าที่ ${currentRound + 1} / ${targetImages.length}`;
    document.getElementById('target-img').src = targetImages[currentRound];
  }

  function takePhoto() {
    const ctx = canvas.getContext('2d');
    canvas.width = 320;
    canvas.height = 320;

    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // ย่อไฟล์รูปเป็น JPEG ขนาดจิ๋ว (~15KB) เพื่อให้ส่งผ่านเน็ตได้เร็ว 100%
    capturedPhotos.push(canvas.toDataURL('image/jpeg', 0.5));
    
    currentRound++;
    updateRoundUI();
  }

  function finishGame() {
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('screen-game').classList.add('hidden');
    document.getElementById('screen-finish').classList.remove('hidden');
  }

  async function submitPhotos() {
    const statusText = document.getElementById('upload-status');
    const submitBtn = document.getElementById('btn-submit');
    
    submitBtn.disabled = true;
    submitBtn.className = "w-full bg-slate-700 text-slate-400 font-bold py-4 rounded-2xl text-xl cursor-not-allowed mb-4";
    statusText.innerText = '⏳ กำลังส่งผลงานไปยังระบบครู...';
    statusText.className = 'text-amber-400 font-medium block mb-4';

    try {
      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ studentName, photos: capturedPhotos })
      });
      const data = await res.json();
      if (data.success) {
        statusText.innerText = '✅ ส่งรูปภาพขึ้นหน้าจอครูสำเร็จแล้ว!';
        statusText.className = 'text-emerald-400 font-medium block mb-4';
      }
    } catch (err) {
      statusText.innerText = '❌ ส่งไม่สำเร็จ กรุณากดลองอีกครั้ง';
      statusText.className = 'text-rose-400 font-medium block mb-4';
      submitBtn.disabled = false;
      submitBtn.className = "w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-2xl text-xl shadow-lg mb-4";
    }
  }

  function switchTab(tab) {
    const isStudent = tab === 'student';
    document.getElementById('student-view').classList.toggle('hidden', !isStudent);
    document.getElementById('teacher-view').classList.toggle('hidden', isStudent);
    
    document.getElementById('btn-tab-student').className = isStudent 
      ? 'px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white shadow-md' 
      : 'px-4 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white';
      
    document.getElementById('btn-tab-teacher').className = !isStudent 
      ? 'px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white shadow-md' 
      : 'px-4 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white';

    if (!isStudent) loadTeacherData();
  }

  async function loadTeacherData() {
    const res = await fetch('/api/results');
    const results = await res.json();
    const gallery = document.getElementById('teacher-gallery');
    gallery.innerHTML = '';
    
    document.getElementById('total-students').innerText = `ส่งแล้ว ${results.length} คน`;

    if (results.length === 0) {
      gallery.innerHTML = `<div class="text-center py-12 text-slate-500">ยังไม่มีนักเรียนส่งรูปภาพในขณะนี้...</div>`;
      return;
    }

    results.forEach(item => addSubmissionToTeacherView(item, false));
  }

  function addSubmissionToTeacherView(data, isNew = false) {
    const gallery = document.getElementById('teacher-gallery');
    if (gallery.innerText.includes('ยังไม่มีนักเรียน')) gallery.innerHTML = '';

    const card = document.createElement('div');
    card.className = `bg-slate-800 border ${isNew ? 'border-emerald-500 shadow-lg shadow-emerald-500/20' : 'border-slate-700'} rounded-2xl p-5 transition-all`;
    
    card.innerHTML = `
      <div class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-2">
          <span class="text-xl">👤</span>
          <h3 class="font-bold text-lg text-white">${data.studentName}</h3>
          ${isNew ? '<span class="bg-emerald-500 text-xs text-white px-2 py-0.5 rounded-full font-bold animate-pulse">ส่งใหม่!</span>' : ''}
        </div>
        <span class="text-xs text-slate-400">${data.timestamp}</span>
      </div>
      <div class="grid grid-cols-5 md:grid-cols-10 gap-2">
        ${data.photos.map((img, i) => `
          <div class="group relative aspect-square rounded-lg overflow-hidden bg-slate-900 border border-slate-700">
            <img src="${img}" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center text-[10px] text-white font-bold transition-all">
              ท่าที่ ${i+1}
            </div>
          </div>
        `).join('')}
      </div>
    `;

    if (isNew) {
      gallery.prepend(card);
      const currentCount = parseInt(document.getElementById('total-students').innerText.replace(/\D/g, '') || 0) + 1;
      document.getElementById('total-students').innerText = `ส่งแล้ว ${currentCount} คน`;
    } else {
      gallery.appendChild(card);
    }
  }
</script>
</body>
</html>
